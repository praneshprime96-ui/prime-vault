<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Vault | Global Coin Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Prime Vault</h1>
        <p>Global Coin Leaderboard & Tracker</p>
    </header>

    <main class="container">
        <!-- LOGIN SECTION -->
        <section id="auth-section" class="form-section">
            <h2>Secure Login</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="Username (For new accounts)">
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button id="login-btn">Login / Register</button>
            <p id="auth-message" style="color: #ff4c4c; margin-top: 10px;"></p>
        </section>

        <!-- MAIN APP SECTION -->
        <div id="app-section" style="display: none; width: 100%;">
            
            <!-- SEARCH BAR AT THE TOP -->
            <section class="form-section" style="margin-bottom: 2rem;">
                <div class="input-group" style="margin-bottom: 0;">
                    <input type="text" id="search-bar" placeholder="🔍 Search for a user or coin...">
                </div>
            </section>

            <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
                <!-- ADD TO VAULT FORM -->
                <section class="form-section" style="flex: 1; min-width: 300px;">
                    <h2>Add to Your Vault</h2>
                    <form id="coin-form">
                        <div class="input-group">
                            <input type="text" id="coin-name" placeholder="Coin Name / Origin" required>
                        </div>
                        <div class="input-group">
                            <input type="number" id="mint-year" placeholder="Mint Year" required>
                        </div>
                        <div class="input-group">
                            <select id="condition" required>
                                <option value="mint">Uncirculated / Mint</option>
                                <option value="excellent">Excellent</option>
                                <option value="good">Good</option>
                                <option value="poor">Poor</option>
                            </select>
                        </div>
                        <!-- FILE UPLOADER -->
                        <div class="input-group">
                            <label style="color: #d4af37; font-size: 0.9rem; display: block; margin-bottom: 5px;">Coin Photo:</label>
                            <input type="file" id="coin-file" accept="image/*" required style="color: #fff;">
                        </div>
                        <button type="submit">Save to Database</button>
                    </form>
                </section>
            </div>

            <!-- GLOBAL COLLECTION GALLERY BELOW -->
            <section class="gallery-section" style="margin-top: 3rem;">
                <h2>Global Collection</h2>
                <div id="gallery-grid" class="grid"></div>
            </section>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
